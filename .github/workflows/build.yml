name: Build All Platforms
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4 
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2 
        with: { flutter-version: '3.41.x', channel: 'stable' }
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4 
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.x', channel: 'stable' }
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with: { name: web-release, path: build/web }

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.x', channel: 'stable' }
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with: { name: linux-release, path: build/linux/x64/release/bundle }

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.x', channel: 'stable' }
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with: { name: windows-release, path: build/windows/x64/runner/Release }
